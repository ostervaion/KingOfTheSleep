services:
  db:
    build:
      context: ./db
    container_name: app_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: app_backend
    restart: unless-stopped
    env_file:
      - .env
    secrets:
      - postgres_user
      - postgres_password
      - secret_key
    environment:
      LOG_VERBOSE: "True"
    volumes:
      - ./backend/app:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_network
      - web_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: app_frontend

    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    networks:
      - web_network
    
  server:
    build:
      context: ./server
    container_name: app_server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
          condition: service_healthy
    networks:
      - web_network

secrets:
  postgres_user:
    file: secrets/postgres_user
  postgres_password:
    file: secrets/postgres_password
  secret_key:
    file: secrets/secret_key
volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  web_network:
    driver: bridge
  db_network:
    driver: bridge
