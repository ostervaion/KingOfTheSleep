services:
    backend:
      environment:
        LOG_VERBOSE: "False"
      command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    frontend:
      build:
        target: prod
      volumes:
        - ./frontend/dist:/dist 
    server:
      build:
        target: prod
      volumes:
      - ./frontend/dist:/dist:ro