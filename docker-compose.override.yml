services:
  backend:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@db:5432/${POSTGRES_DB:-appdb}
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./backend/app:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend/app:/app               # Mount the full frontend directory
      - /app/node_modules              # Protect container node_modules from being overwritten
    healthcheck:
          test: ["CMD-SHELL", "nc -z localhost 5173 || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s
  server:
    depends_on:
      frontend:
          condition: service_healthy